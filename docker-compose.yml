version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_SCHEMA}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nr31-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - uploads_data:/var/lib/nr31/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - nr31-network

  backend:
    image: ghcr.io/poisoniks/nr31-backend:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      - SPRING_DATASOURCE_URL=${POSTGRES_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - APP_STORAGE_PATH=/var/lib/nr31/uploads
    volumes:
      - uploads_data:/var/lib/nr31/uploads
    depends_on:
      - db
    networks:
      - nr31-network

  frontend:
    image: ghcr.io/poisoniks/nr31-frontend:latest
    restart: unless-stopped
    networks:
      - nr31-network

  metrics-collector:
    image: ghcr.io/poisoniks/nr31-metrics-collector:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - PORT=9100
    networks:
      - nr31-network

networks:
  nr31-network:
    driver: bridge

volumes:
  pgdata:
  uploads_data: