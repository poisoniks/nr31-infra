version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_SCHEMA}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nr31-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    environment:
      - APP_STORAGE_PATH=${APP_STORAGE_PATH}
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/templates/app.conf.template:ro
      - uploads_data:${APP_STORAGE_PATH}/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - nr31-network

  backend:
    image: ghcr.io/poisoniks/nr31-backend:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      - SPRING_DATASOURCE_URL=${POSTGRES_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - APP_STORAGE_PATH=${APP_STORAGE_PATH}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL}
      - SPRING_MAIL_HOST=
      - SPRING_MAIL_PORT=
      - SPRING_MAIL_USERNAME=
      - SPRING_MAIL_PASSWORD=
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=false
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=false
      - APP_MAIL_FROM=
      - EMAIL_RATE_LIMIT_SECONDS=${EMAIL_RATE_LIMIT_SECONDS}
    volumes:
      - uploads_data:${APP_STORAGE_PATH}/uploads
    depends_on:
      - db
    networks:
      - nr31-network

  frontend:
    image: ghcr.io/poisoniks/nr31-frontend:latest
    restart: unless-stopped
    networks:
      - nr31-network

  metrics-collector:
    image: ghcr.io/poisoniks/nr31-metrics-collector:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - PORT=9100
    networks:
      - nr31-network

networks:
  nr31-network:
    driver: bridge

volumes:
  pgdata:
  uploads_data: