name: Update config

on:
  workflow_dispatch:

jobs:
  update-server-configs:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Update VPS Configuration via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            source /etc/profile
            source ~/.bashrc || true
            
            set -e
            
            echo "Environment loaded. Current user: $(whoami)"
            
            if ! command -v docker &> /dev/null; then
                echo "Docker could not be found even after sourcing profile!"
                echo "PATH is: $PATH"
                exit 1
            fi
            
            echo "Docker found at: $(which docker)"
            
            cd /opt/nr31
            
            git fetch origin
            git reset --hard origin/main
            
            docker compose up -d --remove-orphans --force-recreate
            
            docker image prune -f
