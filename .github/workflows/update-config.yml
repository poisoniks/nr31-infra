name: Update config

on:
  workflow_dispatch:

jobs:
  update-server-configs:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Update VPS Configuration via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            pwd
            echo "PATH is: $PATH"
